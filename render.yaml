services:
  - type: web
    name: lucky-games-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build:shared && npm --prefix backend run build
    startCommand: npm --prefix backend run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://lucky-games-777.vercel.app
      - key: JWT_EXPIRES_IN
        value: 7d
